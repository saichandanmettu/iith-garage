<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="lane-g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="lane-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Pool Tile Outer Frame -->
  <rect x="18" y="18" width="84" height="84" rx="20" fill="#0C4A6E" fill-opacity="0.25" stroke="url(#lane-g1)" stroke-width="2.5" />
  
  <!-- Swimming Lane Lines / Barcode Stripes -->
  <g transform="translate(30, 32)">
    <rect x="0" y="0" width="4" height="56" rx="2" fill="#38BDF8" />
    <rect x="10" y="0" width="8" height="56" rx="2" fill="#38BDF8" />
    <rect x="24" y="0" width="3" height="56" rx="1.5" fill="#38BDF8" />
    <rect x="33" y="0" width="6" height="56" rx="2" fill="#38BDF8" />
    <rect x="45" y="0" width="4" height="56" rx="2" fill="#38BDF8" />
    <rect x="55" y="0" width="6" height="56" rx="2" fill="#38BDF8" />
  </g>

  <!-- Cyan Laser Scan Beam -->
  <line x1="22" y1="60" x2="98" y2="60" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="60" cy="60" r="3" fill="#FFFFFF" />

  <!-- Swimming Wave Crest Accent -->
  <path d="M26 84 C38 78, 46 88, 60 84 C74 80, 82 88, 94 84" stroke="#7DD3FC" stroke-width="2.5" stroke-linecap="round" fill="none" />
</svg>
