<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" width="100%" height="100%" fill="none">
  <defs>
    <!-- Color definitions matching the official logo -->
    <linearGradient id="pencil-yellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <g transform="translate(0, 5)">
    <!-- LEFT PENCIL TOP ERASER CAP -->
    <path d="M 22 46 C 22 34 32 24 44 24 C 56 24 66 34 66 46 Z" fill="#F59E0B" />
    
    <!-- RIGHT PENCIL TOP ERASER CAP -->
    <path d="M 134 46 C 134 34 144 24 156 24 C 168 24 178 34 178 46 Z" fill="#F59E0B" />

    <!-- MAIN H-SHAPED BODY WITH CONNECTING BRIDGE -->
    <path d="
      M 22 60
      H 66
      V 88
      C 76 88 84 96 90 96
      H 110
      C 116 96 124 88 134 88
      V 60
      H 178
      V 176
      H 134
      V 148
      C 124 148 116 140 110 140
      H 90
      C 84 140 76 148 66 148
      V 176
      H 22
      Z
    " fill="#F59E0B" />

    <!-- LEFT PENCIL VERTICAL FLUTES / FACETS -->
    <rect x="22" y="60" width="12" height="116" fill="#F59E0B" />
    <rect x="36" y="60" width="16" height="116" fill="#FBBF24" />
    <rect x="54" y="60" width="12" height="116" fill="#F59E0B" />

    <!-- RIGHT PENCIL VERTICAL FLUTES / FACETS -->
    <rect x="134" y="60" width="12" height="116" fill="#F59E0B" />
    <rect x="148" y="60" width="16" height="116" fill="#FBBF24" />
    <rect x="166" y="60" width="12" height="116" fill="#F59E0B" />

    <!-- LEFT PENCIL FACET SEPARATORS -->
    <line x1="35" y1="60" x2="35" y2="176" stroke="#FFFFFF" stroke-width="3" />
    <line x1="53" y1="60" x2="53" y2="176" stroke="#FFFFFF" stroke-width="3" />

    <!-- RIGHT PENCIL FACET SEPARATORS -->
    <line x1="147" y1="60" x2="147" y2="176" stroke="#FFFFFF" stroke-width="3" />
    <line x1="165" y1="60" x2="165" y2="176" stroke="#FFFFFF" stroke-width="3" />

    <!-- HORIZONTAL DIVIDER BANDS (BELOW ERASER) -->
    <rect x="22" y="49" width="44" height="6" fill="#FFFFFF" />
    <rect x="134" y="49" width="44" height="6" fill="#FFFFFF" />

    <!-- LEFT PENCIL TIP (ORANGE TRIANGLE) -->
    <polygon points="22,179 66,179 44,212" fill="#EA580C" />

    <!-- RIGHT PENCIL TIP (ORANGE TRIANGLE) -->
    <polygon points="134,179 178,179 156,212" fill="#EA580C" />

    <!-- CENTER OPEN BOOK CUTOUT -->
    <!-- Left Page -->
    <path d="M 98 108 C 90 109 82 107 76 109 L 76 132 C 82 130 90 132 98 135 Z" fill="#FFFFFF" />
    <!-- Right Page -->
    <path d="M 102 108 C 110 109 118 107 124 109 L 124 132 C 118 130 110 132 102 135 Z" fill="#FFFFFF" />
    
    <!-- Central Seam -->
    <line x1="100" y1="96" x2="100" y2="140" stroke="#F59E0B" stroke-width="1.5" />
  </g>
</svg>
